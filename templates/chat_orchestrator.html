<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Orchestrateur — HEL AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <main class="container my-5">

        <a href="/" class="btn btn-outline-secondary btn-sm mb-3">← Retour accueil</a>

        <div class="card hel-card">
            <div class="card-body p-4 p-md-5">

                <h2 class="card-title text-primary-dark">🎼 Agent IA Orchestrateur</h2>
                <p class="text-muted">
                    Posez n'importe quelle question. L'agent choisit automatiquement 
                    le meilleur assistant pour vous répondre.
                </p>

                <div class="chat-area chat-area-large mt-4" id="chat-area">
                    <div class="chat-message bot">
                        <strong>👋 Bonjour</strong>
                        <p class="small mb-0 mt-1">
                            Je suis l'agent orchestrateur. Posez-moi n'importe quelle question 
                            et je choisirai automatiquement le meilleur assistant.
                        </p>
                    </div>
                </div>

                <div class="input-group mt-3">
                    <input type="text" class="form-control form-control-lg"
                           id="chat-input" placeholder="Posez votre question…" autofocus>
                    <button class="btn btn-dark" id="chat-send">Envoyer</button>
                </div>

            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="/static/js/chat_orchestrator.js"></script>
</body>
</html>
